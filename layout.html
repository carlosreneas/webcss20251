<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Responsivo</title>
    <style>
        body {
            font-size: 16px; /* Base */
        }
        
        .container {
            width: 80%;
            max-width: 1200px;
            margin: auto;
            background-color: lightgray;
            padding: 20px;
        }
        .box {
            width: 100%;
            padding: 20px;
            background-color: cornflowerblue;
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Caja 1</div>
        <div class="box">Caja 2</div>
        <div class="box">Caja 3</div>
    </div>
</body>
</html>
